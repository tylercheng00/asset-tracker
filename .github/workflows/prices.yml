name: Update prices

on:
  schedule:
    # Every hour on weekdays (UTC), covering Hong Kong and US trading hours.
    - cron: "17 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python3 tools/fetch_prices.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/prices.json)" ]; then
            echo "No changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "prices: update"
          git pull --rebase origin main
          git push
